<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown • Feira do Alvarinho de Monção 2027</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="countdown-section">

    <div class="banner" aria-hidden="true"></div>
    <div class="overlay" aria-hidden="true"></div>

    <div class="content">

      <p class="kicker">Feira do Alvarinho de Monção</p>

      <h1 class="title">Está a chegar o dia</h1>

      <p class="subtitle">Da maior wine party de Portugal</p>

      <div class="countdown" id="countdown" aria-live="polite">
        <div class="unit">
          <span class="number" id="weeks">00</span>
          <span class="label">Semanas</span>
        </div>
        <div class="unit">
          <span class="number" id="days">00</span>
          <span class="label">Dias</span>
        </div>
        <div class="unit">
          <span class="number" id="hours">00</span>
          <span class="label">Horas</span>
        </div>
        <div class="unit">
          <span class="number" id="minutes">00</span>
          <span class="label">Minutos</span>
        </div>
        <div class="unit">
          <span class="number" id="seconds">00</span>
          <span class="label">Segundos</span>
        </div>
      </div>

      <p class="target-date">1 de julho de 2027 · 18h00</p>
      <p class="message" id="message"></p>

    </div>

    <footer class="footer">
      <span>1 a 4 julho 2027 · Monção</span>
    </footer>

  </section>

  <script src="script.js"></script>
</body>
</html>
